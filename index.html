<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <link href="index.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" 
    crossorigin="anonymous">
</head>
<body>
    <form action="/submit data" method="post">
        <div class="loginform">
            
            <div class="credential">
                
                <h3>LOGIN</h3>
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" required class="form-control" placeholder="Enter you Email"/>

                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" required class="form-control" placeholder="Enter Password"/>

                <span id="terms">
                    <input type="checkbox" id="checkbox" required name="checkbox">
                    <label for="checkbox">accept terms</label>
                </span>

                <div class="button">
                    <div>
                        <button type="submit" class="btn-solid theme-primary">Log In</button>
                    </div>
                    <div>
                        <button type="submit" class="btn-solid theme-primary">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
